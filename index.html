<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Invoice Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Freelance Invoice Generator</h1>
    <p class="subtitle">Create your invoice quickly</p>

    <div class="form-box">

        <label>Your Name / Business</label>
        <input type="text" id="business" placeholder="Your Business">

        <label>Client Name</label>
        <input type="text" id="client" placeholder="Client Name">

        <label>Service</label>
        <input type="text" id="service" placeholder="Web Development">

        <label>Price</label>
        <input type="number" id="price" placeholder="100">

        <label>Quantity</label>
        <input type="number" id="quantity" value="1" min="1">

        <label>Tax (%)</label>
        <input type="number" id="tax" value="0" min="0">

        <button onclick="generateInvoice()">Generate Invoice</button>

    </div>

    <div id="invoice" class="invoice">

        <div class="invoice-header">
            <div>
                <h2 id="invoiceBusiness">Your Business</h2>
                <p>Professional Invoice</p>
            </div>

            <div>
                <strong>INVOICE #001</strong>
                <p id="invoiceDate"></p>
            </div>
        </div>

        <hr>

        <p><strong>Bill To:</strong></p>
        <p id="invoiceClient">Client Name</p>

        <table>
            <thead>
                <tr>
                    <th>Service</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Total</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td id="invoiceService">Service</td>
                    <td id="invoiceQuantity">1</td>
                    <td id="invoicePrice">$0</td>
                    <td id="invoiceTotal">$0</td>
                </tr>
            </tbody>
        </table>

        <div class="summary">
            <p>Subtotal: <strong id="subtotal">$0</strong></p>
            <p>Tax: <strong id="taxAmount">$0</strong></p>
            <h2>Total: <span id="finalTotal">$0</span></h2>
        </div>

        <button class="print-btn" onclick="window.print()">
            Print / Save PDF
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
